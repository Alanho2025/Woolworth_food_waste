[project]
name = "foodflow-backend"
version = "0.1.0"
description = "FastAPI and PostgreSQL foundation for the FoodFlow platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = [
    "B008", # FastAPI Depends() in defaults is the framework idiom.
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["backend/app"]
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
