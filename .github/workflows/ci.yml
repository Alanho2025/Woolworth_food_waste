name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodflow
          POSTGRES_USER: foodflow
          POSTGRES_PASSWORD: foodflow-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodflow -d foodflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies from lock
        run: uv sync --all-extras --locked
      - name: Install root dependencies from lock
        run: npm ci
      - name: Install frontend dependencies from lock
        run: npm --prefix frontend ci
      - name: Run the foundation quality gate
        env:
          DATABASE_URL: postgresql+psycopg://foodflow:foodflow-ci@localhost:5432/foodflow
        run: ./scripts/quality_gate.sh
